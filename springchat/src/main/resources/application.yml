server:
  port: ${PORT:9090}
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${SPRING_PROFILE_ACTIVE:prod}}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  

jwt:
  secret: ${JWT_SECRET:f92b9206a9471c9ba0122554f556216f901da6face89b1a8f3aa4616bd1890862d57e5cb}
  expiration: 604800000

frontend:
  url: ${FRONTEND_URL:https://gleaming-belekoy-d16620.netlify.app}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.web: INFO
    com.chat: INFO

---
# Local profile (uses H2 in-memory database for local development)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:chatdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

---
# Production profile for Railway (uses PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:iriguchi.proxy.rlwy.net}:${PGPORT:46269}/${PGDATABASE:railway}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:NzsUamlrMQEycaUibWdfjnqJdYPISCuE}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect